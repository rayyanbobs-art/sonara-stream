[package]
name = "sonara-stream"
version = "0.1.0"
description = "A sleek instant streaming music player"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = ["config-json5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
