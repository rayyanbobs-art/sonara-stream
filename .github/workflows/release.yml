name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Fetch bundled yt-dlp sidecar
        shell: pwsh
        run: ./scripts/fetch-ytdlp.ps1

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        run: bun run test

      - name: Run backend tests
        run: cargo test
        working-directory: ./src-tauri

      - name: Run clippy
        run: cargo clippy -- -D warnings
        working-directory: ./src-tauri

      - name: Prepare signing key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node -e '
            const fs = require("fs");
            let key = (process.env.RAW_KEY || "").replace(/^\uFEFF/, "").trim();
            let pass = (process.env.RAW_PASSWORD || "").replace(/^\uFEFF/, "").trim();
            const keyPath = (process.env.RUNNER_TEMP || ".").replace(/\\/g, "/") + "/tauri_private.key";
            fs.writeFileSync(keyPath, key, "utf8");
            fs.appendFileSync(process.env.GITHUB_ENV, `CLEAN_KEY_PATH=${keyPath}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `CLEAN_PASSWORD=${pass}\n`);
          '

      - name: Build Tauri app and generate release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.CLEAN_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.CLEAN_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Sonara Stream ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for release notes and changes.'
          releaseDraft: false
          prerelease: false
