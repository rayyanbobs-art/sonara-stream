name: Android Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Init Tauri Android
        run: bun run tauri android init

      - name: Configure Android Permissions, Immersive UI & Background Service
        run: python3 scripts/configure-android.py

      - name: Build Android APK
        run: bun run tauri android build --apk

      - name: Sign and Align APK for Release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found unsigned APK: $RAW_APK"

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build-tools: $BUILD_TOOLS"

          # 4-byte boundary alignment
          $BUILD_TOOLS/zipalign -v -p 4 "$RAW_APK" SonaraStream-aligned.apk

          # Obtain or generate release keystore
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using persistent release keystore from GitHub Secrets"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.jks
          else
            echo "Generating fallback release keystore"
            keytool -genkey -v -keystore release.jks -alias sonara \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass sonarastream -keypass sonarastream \
              -dname "CN=SonaraStream, OU=Audio, O=Sonara, L=Unknown, S=Unknown, C=US"
          fi

          # Sign APK with v1 (JAR), v2 (APK Signature v2), and v3 schemes
          $BUILD_TOOLS/apksigner sign --ks release.jks \
            --ks-key-alias sonara \
            --ks-pass pass:sonarastream \
            --key-pass pass:sonarastream \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out SonaraStream-Android.apk SonaraStream-aligned.apk

          # Verify signature
          $BUILD_TOOLS/apksigner verify --verbose SonaraStream-Android.apk
          ls -la SonaraStream-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonaraStream-Android-APK
          path: SonaraStream-Android.apk

      - name: Attach APK to GitHub Release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TARGET_TAG="$GITHUB_REF_NAME"
          else
            TARGET_TAG=$(gh release view --json tagName -q .tagName || echo "")
          fi

          if [ -n "$TARGET_TAG" ]; then
            echo "Uploading SonaraStream-Android.apk to release $TARGET_TAG"
            gh release upload "$TARGET_TAG" SonaraStream-Android.apk --clobber || gh release create "$TARGET_TAG" SonaraStream-Android.apk --title "Sonara Stream $TARGET_TAG" --notes "Release $TARGET_TAG"
          else
            echo "No release found to attach APK to."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
